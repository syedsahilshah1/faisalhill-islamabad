name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build & Export Next.js
        working-directory: frontend
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: https://api.faisalhillsislamabadfh.com/api
          NEXT_PUBLIC_SITE_URL: https://faisalhillsislamabadfh.com

      - name: 🚀 Push built files to deploy branch
        run: |
          cd frontend/out
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b deploy
          git add -A
          git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git deploy
